services:
  postgres:
    image: postgres:15
    container_name: cricket-auction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cricket_auction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cricket_auction"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
