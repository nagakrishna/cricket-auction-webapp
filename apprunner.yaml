version: 1.0
runtime: nodejs20

build:
  commands:
    build:
      - npm ci
      - npm run build

run:
  command: npm run start
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: production

# Configure these as App Runner environment variables or secrets:
# - DATABASE_URL
# - APP_URL
# - ADMIN_EMAIL
# - ADMIN_PASSWORD
# - SEED_OWNER_PASSWORD
